<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="広島・中新地。縁起の文様、語らいの席。麻ノ葉。">
<title>麻ノ葉 — 広島・中新地</title>
<meta name="theme-color" content="#1a0c08">

<!-- PWA -->
<link rel="manifest"          href="../manifest.webmanifest">
<link rel="icon"              href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon"  href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable"          content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title"            content="中新地">
<meta name="mobile-web-app-capable"                content="yes">
<script src="../pwa-register.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700&family=Yuji+Syuku&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="../config.js"></script>
<script src="../api-client.js" defer></script>
</head>
<body>

<!-- ===========================================
     HERO SECTION — 麻ノ葉 (中新地)
     - 店名・コピーは下記 .hero__brand / .hero__copy / .hero__sub を編集
     - 背景画像は public/images/hero-japanese.jpg
     =========================================== -->
<section class="hero" aria-label="麻ノ葉">

  <div class="hero__bg" aria-hidden="true"></div>
  <div class="hero__overlay" aria-hidden="true"></div>

  <!-- 赤い筆文字（空気感）— 主役にしない -->
  <div class="hero__floaters" aria-hidden="true">
    <span class="floater floater--1">麻</span>
    <span class="floater floater--2">葉</span>
    <span class="floater floater--3">縁</span>
    <span class="floater floater--4">光</span>
    <span class="floater floater--5">夢</span>
    <span class="floater floater--6">友</span>
  </div>

  <div class="hero__content">
    <div class="hero__top-line">
      <p class="hero__mark"><span class="hero__mark-line"></span>HIROSHIMA · 中新地 · 縁起の席</p>
      <div class="hero__badges">
        <div class="hero__status" id="hero-status" data-status="loading" hidden>
          <span class="hero__status-dot"></span>
          <span class="hero__status-text">確認中…</span>
        </div>
        <div class="hero__seats-badge" id="hero-seats" hidden>
          <span class="hero__seats-text" id="hero-seats-text">残り — 席</span>
        </div>
      </div>
    </div>

    <!-- お知らせ（管理画面で設定された場合のみ表示） -->
    <div class="hero__news" id="hero-news" hidden>
      <span class="hero__news-tag">お知らせ</span>
      <span class="hero__news-text" id="hero-news-text"></span>
    </div>

    <h1 class="hero__brand">麻<span class="hero__brand-accent">ノ</span>葉</h1>
    <p class="hero__brand-jp">M A N O H A &nbsp;/&nbsp; ま の は</p>

    <p class="hero__copy">縁起の文様、<br class="sp-only">語らいの席。</p>

    <p class="hero__sub">
      広島・中新地、酌み交わす夜に。<br>
      友と、語らい、夢を結ぶ場所。
    </p>

    <div class="hero__actions">
      <a href="#contact" class="btn btn--primary">ご予約・お問い合わせ</a>
      <a href="#menu" class="btn btn--ghost">お品書きを見る</a>
    </div>
  </div>

  <div class="hero__scroll" aria-hidden="true">
    <span>S C R O L L</span>
    <span class="hero__scroll-line"></span>
  </div>

  <!-- 中新地 飲食店ガイド トップへ戻る（左上） -->
  <a href="../" class="hero__back" title="中新地 飲食店ガイド トップへ">←&nbsp;中新地</a>

  <!-- 昼/夜 テーマ切替（右上） -->
  <button class="hero__theme" id="theme-toggle" type="button" aria-label="昼夜 テーマ切替">
    <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
      <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54A9.05 9.05 0 0 0 12 3z"/>
    </svg>
    <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
        <line x1="12" y1="2"     x2="12"    y2="5"/>
        <line x1="12" y1="19"    x2="12"    y2="22"/>
        <line x1="2"  y1="12"    x2="5"     y2="12"/>
        <line x1="19" y1="12"    x2="22"    y2="12"/>
        <line x1="4.93"  y1="4.93"  x2="7.05"  y2="7.05"/>
        <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
        <line x1="4.93"  y1="19.07" x2="7.05"  y2="16.95"/>
        <line x1="16.95" y1="7.05"  x2="19.07" y2="4.93"/>
      </g>
    </svg>
  </button>

  <!-- 店主向け 管理リンク（控えめに右下） -->
  <a href="../asanoha-admin/" class="hero__admin" title="店主向け管理画面">管理&nbsp;→</a>
</section>

<script src="script.js" defer></script>
</body>
</html>
