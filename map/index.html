<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="広島・中新地 飲み屋街ガイド — 地図で探す">
<title>地図で探す — 中新地</title>

<link rel="icon"             href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable"          content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">

<!-- Leaflet (OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="../config.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16181d; --muted:#6b7280; --soft:#9aa1ab;
  --line:#e6e8ec; --brand:#1f2233; --accent:#d4365a; --green:#16a34a; --amber:#e8920c; --blue:#2563eb;
  --sans:'Noto Sans JP',system-ui,sans-serif; --disp:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
}
html, body { height: 100%; background: var(--bg); }
body {
  font-family: var(--sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* topbar */
.topbar {
  flex-shrink: 0;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  z-index: 20;
}
.topbar__back {
  color: var(--brand); text-decoration: none;
  font-size: 12px; font-weight: 700;
  padding: 8px 14px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  flex-shrink: 0;
}
.topbar__title { flex: 1; text-align: center; font-family: var(--disp); font-weight: 900; font-size: 16px; }
.topbar__title .ac { color: var(--accent); }
.topbar__filter {
  flex-shrink: 0;
  padding: 8px 13px; font-size: 11px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); cursor: pointer;
}
.topbar__filter[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

/* map */
.map-wrap { position: relative; flex-shrink: 0; height: 42vh; }
#map { position: absolute; inset: 0; background: #e9edf0; }
.locate-fab {
  position: absolute; bottom: 14px; right: 14px; z-index: 500;
  width: 44px; height: 44px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 50%;
  color: var(--brand); display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
.locate-fab svg { width: 20px; height: 20px; }

/* ピン */
.store-pin__inner {
  width: 30px; height: 30px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2.5px solid #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.4);
}
.store-pin__inner::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); width: 9px; height: 9px; background: #fff; border-radius: 50%;
}
.store-pin--available .store-pin__inner { background: var(--accent); }
.store-pin--full      .store-pin__inner { background: #9aa1ab; }
.store-pin--stopped   .store-pin__inner { background: var(--amber); }
.store-pin--closed    .store-pin__inner { background: #b8bec7; }
.store-pin--active .store-pin__inner {
  width: 40px; height: 40px;
  border-width: 3px;
  box-shadow: 0 0 0 6px rgba(212,54,90,0.25), 0 4px 10px rgba(0,0,0,.4);
  z-index: 1000 !important;
}
.user-pin {
  width: 16px; height: 16px; background: var(--blue);
  border: 3px solid #fff; border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(37,99,235,0.4); animation: userPulse 2s ease-in-out infinite;
}
@keyframes userPulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4);} 50%{box-shadow:0 0 0 14px rgba(37,99,235,0);} }

/* フィルタチップ */
.chips {
  flex-shrink: 0;
  display: flex; gap: 8px; overflow-x: auto;
  padding: 12px 14px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; font-size: 13px; font-weight: 600;
  padding: 8px 15px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line); color: var(--muted);
  white-space: nowrap; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }

/* リスト */
.list {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: 8px 0 calc(20px + env(safe-area-inset-bottom, 0px));
}
.list__head { padding: 10px 16px 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.list__head strong { color: var(--ink); }
.row {
  display: flex; gap: 12px; align-items: center;
  background: var(--surface);
  margin: 0 12px 8px; padding: 10px;
  border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: inherit; cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.row--active {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(212,54,90,0.18);
}
.row__thumb {
  width: 72px; height: 72px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
  position: relative; background: #eceef1;
}
.row__thumb img { width: 100%; height: 100%; object-fit: cover; }
.row__badge {
  position: absolute; bottom: 4px; left: 4px;
  font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
  background: rgba(22,163,74,0.92); color: #fff;
}
.row__badge--full   { background: rgba(154,161,171,0.95); }
.row__badge--stopped{ background: rgba(232,146,12,0.95); }
.row__badge--closed { background: rgba(120,127,138,0.92); }
.row__body { flex: 1; min-width: 0; }
.row__name { font-family: var(--disp); font-weight: 900; font-size: 16px; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__name .ac { color: var(--accent); }
.row__tags { font-size: 11px; color: var(--soft); margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__line { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: baseline; }
.row__open { color: var(--green); font-weight: 700; }
.row__open--closed { color: var(--soft); }
.row__dist { color: var(--blue); font-weight: 700; }
.row__chevron { color: var(--soft); flex-shrink: 0; }

/* ポップアップ (Leaflet) */
.leaflet-popup-content-wrapper { border-radius: 12px !important; }
.leaflet-popup-content { margin: 10px 12px !important; }
.popup__name { font-family: var(--disp); font-weight: 900; font-size: 16px; margin-bottom: 2px; }
.popup__name .ac { color: var(--accent); }
.popup__meta { font-size: 11px; color: var(--muted); }
.popup__cta { display:inline-block; margin-top:8px; font-size:12px; font-weight:700; color:var(--accent); }

.leaflet-control-attribution { font-size: 9px !important; }

/* ===== font weight ===== */
body { font-weight: 500; }
h1,h2,h3 { font-weight: 700; }
strong, b { font-weight: 700; }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar__back" href="../">← 戻る</a>
  <div class="topbar__title">中<span class="ac">新</span>地 マップ</div>
  <button class="topbar__filter" id="filter-btn" type="button" aria-pressed="false">空席あり</button>
</header>

<div class="map-wrap">
  <div id="map"></div>
  <button class="locate-fab" id="locate-fab" type="button" aria-label="現在地">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
  </button>
</div>

<div class="chips" id="chips"></div>

<div class="list" id="list">
  <div class="list__head" id="list-head">—</div>
  <div id="list-rows"></div>
</div>

<script>
(function () {
  'use strict';

  // ===== 営業状態判定 (landing と同じロジック) =====
  var HOURS_KEY='manoha-hours-v1', SEATS_KEY='manoha-seats-v1';
  var DEF_ASA={open:'17:00',close:'01:00',crossDay:true,closedDays:[],reception:'normal',receptionDate:''};
  var DEF_IVO={open:'21:00',close:'05:00',crossDay:true,closedDays:[2],reception:'normal',receptionDate:''};
  var TOTAL_ASA=11;
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function readCache(id,key,legacy,def){
    try{var c=JSON.parse(localStorage.getItem('store-cache:'+id+':'+key)||'null');if(c&&c.value)return Object.assign({},def||{},c.value);}catch(_){}
    if(id==='asanoha'){try{var v=JSON.parse(localStorage.getItem(legacy)||'null');if(v)return Object.assign({},def||{},v);}catch(_){}}
    return Object.assign({},def||{});
  }
  function readHours(s){
    var def = s.id==='ivory'?DEF_IVO : (s.hours?{open:s.hours.open,close:s.hours.close,crossDay:s.hours.crossDay,closedDays:s.hours.closedDays||[],reception:'normal',receptionDate:''}:DEF_ASA);
    var h=readCache(s.id,'hours',s.id==='asanoha'?HOURS_KEY:null,def);
    if(h.reception!=='normal'&&h.receptionDate!==todayStr())h.reception='normal';
    return h;
  }
  function readSeats(id){return readCache(id,'seats',id==='asanoha'?SEATS_KEY:null,{});}
  function countTaken(s){var t=0;Object.keys(s).forEach(function(k){if(s[k])t++;});return t;}
  function isOpenNow(now,h){
    if(h.reception==='closed')return{open:false};
    if(h.reception==='stopped')return{open:false,stopped:true};
    if((h.closedDays||[]).indexOf(now.getDay())!==-1)return{open:false};
    var op=h.open.split(':'),cl=h.close.split(':');
    var n=now.getHours()*60+now.getMinutes(),o=(+op[0])*60+(+op[1]),c=(+cl[0])*60+(+cl[1]);
    var open=h.crossDay?(n>=o||n<c):(n>=o&&n<c);
    return{open:open};
  }
  function getState(s){
    var h=readHours(s),st=isOpenNow(new Date(),h);
    if(st.stopped)return'stopped';
    if(!st.open)return'closed';
    if(s.id==='asanoha'){var open=TOTAL_ASA-countTaken(readSeats('asanoha'));return open>0?'available':'full';}
    return'available';
  }
  var STATE_LABEL={available:'営業中・空席あり',full:'営業中・満席',stopped:'受付停止',closed:'営業時間外'};
  var STATE_SHORT={available:'空席',full:'満席',stopped:'停止',closed:'時間外'};
  var STATE_ORDER={available:0,full:1,stopped:2,closed:3};

  function fmtHours(h){
    if(!h||!h.open||!h.close)return'';
    var c=h.close;
    if(h.crossDay){var p=c.split(':');var hh=parseInt(p[0],10);if(hh<12)c=(hh+24)+':'+p[1];}
    return h.open+'–'+c;
  }
  function genreLabels(s){
    var defs=window.NAKASHINCHI_CATEGORIES||[];
    return (s.categories||[]).map(function(c){var d=defs.find(function(x){return x.id===c;});return d?d.label:c;});
  }
  function nameHtml(s){
    if(s.id==='asanoha')return'麻<span class="ac">ノ</span>葉';
    return s.short||s.name;
  }

  // ===== 距離 =====
  var userLat=null,userLng=null;
  function haversine(la1,lo1,la2,lo2){
    var R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }
  function fmtDist(km){return km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km';}

  // ===== 店舗 =====
  var STORES=(window.NAKASHINCHI_STORES||[]).filter(function(s){return s.lat&&s.lng;});

  // ===== マップ =====
  var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([34.3915,132.4595],15);
  L.control.zoom({position:'topleft'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains:'abcd',maxZoom:20
  }).addTo(map);

  var markers={};   // id -> marker
  var rowEls={};    // id -> row element
  var activeId=null;

  function makeIcon(state,active){
    return L.divIcon({
      className:'store-pin store-pin--'+state+(active?' store-pin--active':''),
      html:'<div class="store-pin__inner"></div>',
      iconSize:[30,38],iconAnchor:[15,30]
    });
  }
  function popupHtml(s,state){
    return '<div class="popup__name">'+nameHtml(s)+'</div>'+
      '<div class="popup__meta">'+STATE_LABEL[state]+' · '+genreLabels(s).join('・')+'</div>'+
      (s.heroUrl?'<a class="popup__cta" href="../'+s.heroUrl+'">店ページへ →</a>':'');
  }

  // ===== フィルタ状態 =====
  var genre='all', availOnly=false;
  try{availOnly=localStorage.getItem('map-filter-available')==='1';}catch(_){}

  function visibleStores(){
    return STORES.filter(function(s){
      if(genre!=='all'&&(s.categories||[]).indexOf(genre)<0)return false;
      if(availOnly&&getState(s)!=='available')return false;
      return true;
    });
  }
  function sortStores(arr){
    return arr.slice().sort(function(a,b){
      if(userLat!=null){
        return haversine(userLat,userLng,a.lat,a.lng)-haversine(userLat,userLng,b.lat,b.lng);
      }
      return STATE_ORDER[getState(a)]-STATE_ORDER[getState(b)];
    });
  }

  function setActive(id,fly){
    activeId=id;
    // ピン更新
    Object.keys(markers).forEach(function(k){
      var s=storeById(k),st=getState(s);
      markers[k].setIcon(makeIcon(st,k===id));
    });
    // 行ハイライト
    Object.keys(rowEls).forEach(function(k){
      rowEls[k].classList.toggle('row--active',k===id);
    });
    if(id){
      var s=storeById(id);
      if(fly) map.flyTo([s.lat,s.lng],17,{duration:0.5});
      if(markers[id]) markers[id].openPopup();
      if(rowEls[id]) rowEls[id].scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  }
  function storeById(id){return STORES.find(function(s){return s.id===id;});}

  // ===== 描画 =====
  function render(){
    var list=sortStores(visibleStores());
    // マーカー
    Object.keys(markers).forEach(function(k){map.removeLayer(markers[k]);});
    markers={};
    list.forEach(function(s){
      var st=getState(s);
      var m=L.marker([s.lat,s.lng],{icon:makeIcon(st,s.id===activeId)});
      m.bindPopup(popupHtml(s,st),{closeButton:true,autoPan:true});
      m.on('click',function(){ setActive(s.id,false); });
      m.addTo(map);
      markers[s.id]=m;
    });
    // リスト
    var head=document.getElementById('list-head');
    var availN=list.filter(function(s){return getState(s)==='available';}).length;
    head.innerHTML='<strong>'+list.length+'</strong> 軒'+(userLat!=null?'（近い順）':'')+' / 今すぐ行ける <strong>'+availN+'</strong> 軒';
    var rowsWrap=document.getElementById('list-rows');
    rowsWrap.innerHTML='';
    rowEls={};
    list.forEach(function(s){
      var st=getState(s);
      var bcls = st==='available'?'':(' row__badge--'+st);
      var hoursStr=fmtHours(s.hours)||'';
      var distStr=(userLat!=null)?fmtDist(haversine(userLat,userLng,s.lat,s.lng)):'';
      var row=document.createElement('div');
      row.className='row';
      row.dataset.storeId=s.id;
      row.innerHTML=
        '<div class="row__thumb">'+
          (s.imageUrl?'<img src="'+s.imageUrl+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://picsum.photos/seed/'+encodeURIComponent(s.id)+'/200/200\'">':'')+
          '<span class="row__badge'+bcls+'">'+STATE_SHORT[st]+'</span>'+
        '</div>'+
        '<div class="row__body">'+
          '<div class="row__name">'+nameHtml(s)+'</div>'+
          '<div class="row__tags">'+genreLabels(s).join('・')+(s.area?' / '+s.area:'')+'</div>'+
          '<div class="row__line">'+
            '<span class="'+(st==='closed'?'row__open--closed':'row__open')+'">'+(st==='closed'?'時間外':'営業中')+'</span>'+
            (hoursStr?'<span>'+hoursStr+'</span>':'')+
            (distStr?'<span class="row__dist">'+distStr+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="row__chevron">›</div>';
      row.addEventListener('click',function(){ setActive(s.id,true); });
      rowsWrap.appendChild(row);
      rowEls[s.id]=row;
    });
  }

  // ===== チップ =====
  function renderChips(){
    var chipsEl=document.getElementById('chips');
    var defs=window.NAKASHINCHI_CATEGORIES||[];
    chipsEl.innerHTML='';
    defs.forEach(function(g){
      var n = g.id==='all'?STORES.length:STORES.filter(function(s){return (s.categories||[]).indexOf(g.id)!==-1;}).length;
      if(n===0&&g.id!=='all')return;
      var b=document.createElement('button');
      b.className='chip';b.type='button';b.dataset.genre=g.id;
      b.setAttribute('aria-pressed',g.id===genre?'true':'false');
      b.textContent=g.label+' '+n;
      b.addEventListener('click',function(){
        genre=g.id;
        chipsEl.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.genre===genre?'true':'false');});
        activeId=null; render();
      });
      chipsEl.appendChild(b);
    });
  }

  // ===== 空席フィルタ =====
  var filterBtn=document.getElementById('filter-btn');
  function applyFilterUI(){
    filterBtn.setAttribute('aria-pressed',availOnly?'true':'false');
    filterBtn.textContent=availOnly?'空席あり ✓':'空席あり';
  }
  applyFilterUI();
  filterBtn.addEventListener('click',function(){
    availOnly=!availOnly;
    try{localStorage.setItem('map-filter-available',availOnly?'1':'0');}catch(_){}
    applyFilterUI(); activeId=null; render();
  });

  // ===== 現在地 =====
  var userMarker=null;
  function locate(){
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(function(pos){
      userLat=pos.coords.latitude;userLng=pos.coords.longitude;
      if(userMarker)map.removeLayer(userMarker);
      userMarker=L.marker([userLat,userLng],{icon:L.divIcon({className:'',html:'<div class="user-pin"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(map);
      map.setView([userLat,userLng],16);
      render();  // 近い順で再ソート
    },function(){},{timeout:8000,enableHighAccuracy:false});
  }
  document.getElementById('locate-fab').addEventListener('click',locate);

  // ===== サーバ同期 =====
  async function fetchStoreAll(id){
    if(!window.NAKASHINCHI_API)return;
    try{var r=await fetch(window.NAKASHINCHI_API+'/api/store/'+id+'/all',{cache:'no-cache'});if(!r.ok)return;
      var d=await r.json();Object.keys(d.data||{}).forEach(function(k){try{localStorage.setItem('store-cache:'+id+':'+k,JSON.stringify({value:d.data[k].value,updatedAt:d.data[k].updatedAt}));}catch(_){}});}catch(_){}
  }
  async function syncAll(){
    // 実データ店 (asanoha/ivory) のみ取得
    await Promise.all(STORES.filter(function(s){return !s.demo;}).map(function(s){return fetchStoreAll(s.id);}));
    var keepActive=activeId; render(); if(keepActive)setActive(keepActive,false);
  }

  // 紹介元 (Phase 0): ?ref=<storeId> で来訪 → 3時間保持。ランディングの「今から向かう」で付与される
  try {
    var _ref = new URLSearchParams(location.search).get('ref');
    if (_ref) localStorage.setItem('nakashinchi-referrer', JSON.stringify({ storeId: _ref, exp: Date.now() + 3 * 3600 * 1000 }));
  } catch (_) {}

  // 初期化
  renderChips();
  render();
  locate();
  syncAll();
  setInterval(syncAll,30*1000);
  // マップサイズ確定後にリサイズ
  setTimeout(function(){map.invalidateSize();},200);
  window.addEventListener('resize',function(){map.invalidateSize();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)syncAll();});
})();
</script>
