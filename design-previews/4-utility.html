<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>案4 実用ユーティリティ — デザインプレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff; --bg2:#f3f4f6; --ink:#1f2328; --muted:#5f6b7a; --soft:#9aa4b2;
  --line:#e5e7eb; --accent:#e8533b; --green:#15a34a; --blue:#2563eb;
  --sans:'Noto Sans JP',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg2);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:60px;}
.preview-tag{position:fixed;top:0;left:0;right:0;z-index:99;background:var(--accent);color:#fff;text-align:center;font-size:11px;letter-spacing:.1em;padding:6px;font-weight:700;}

.appbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(32px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;gap:10px;}
.appbar__brand{font-weight:900;font-size:16px;flex-shrink:0;}
.appbar__brand .ac{color:var(--accent);}
.appbar__search{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px;}
.appbar__search svg{width:15px;height:15px;}

/* map area */
.map{position:relative;height:200px;background:
  linear-gradient(rgba(37,99,235,.04),rgba(37,99,235,.04)),
  repeating-linear-gradient(0deg,#e8eaed 0 1px,transparent 1px 26px),
  repeating-linear-gradient(90deg,#e8eaed 0 1px,transparent 1px 26px),#eef1f4;
  border-bottom:1px solid var(--line);overflow:hidden;}
.map__road{position:absolute;background:#dfe3e8;}
.map__road--1{top:60px;left:0;right:0;height:14px;transform:rotate(-4deg);}
.map__road--2{top:0;bottom:0;left:42%;width:14px;}
.map__pin{position:absolute;transform:translate(-50%,-100%);text-align:center;}
.map__pin .dot{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);margin:0 auto;}
.map__pin .lbl{font-size:10px;font-weight:700;background:#fff;padding:1px 5px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);margin-top:4px;display:inline-block;}
.map__pin--a{top:78px;left:30%;}.map__pin--a .dot{background:var(--accent);}
.map__pin--b{top:120px;left:62%;}.map__pin--b .dot{background:var(--accent);}
.map__pin--c{top:150px;left:20%;}.map__pin--c .dot{background:var(--soft);}
.map__me{position:absolute;top:170px;left:48%;width:14px;height:14px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(37,99,235,.2);}

/* filter bar */
.filterbar{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;}
.filterbar::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
.fbtn--on{background:var(--ink);color:#fff;border-color:var(--ink);}

.listhead{padding:12px 14px 8px;font-size:12px;color:var(--muted);font-weight:600;}
.listhead strong{color:var(--ink);}

/* row cards (food-log style) */
.row{display:flex;gap:12px;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;}
.row__thumb{width:92px;height:92px;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;background:#eee;}
.row__thumb img{width:100%;height:100%;object-fit:cover;}
.row__badge{position:absolute;bottom:5px;left:5px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(21,163,74,.92);color:#fff;}
.row__badge--full{background:rgba(232,83,59,.92);}
.row__body{flex:1;min-width:0;}
.row__name{font-weight:900;font-size:16px;margin-bottom:3px;}
.row__tags{font-size:11px;color:var(--soft);margin-bottom:6px;}
.row__line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:3px;}
.row__line .dist{color:var(--blue);font-weight:700;}
.row__open{color:var(--green);font-weight:700;}
.row__seats{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<div class="preview-tag">案 4 ／ 実用ユーティリティ（地図中心・食べログ風）</div>

<header class="appbar">
  <div class="appbar__brand">飲み屋街<span class="ac">ナビ</span></div>
  <div class="appbar__search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>店名・エリアで探す</div>
</header>

<div class="map">
  <div class="map__road map__road--1"></div>
  <div class="map__road map__road--2"></div>
  <div class="map__pin map__pin--a"><div class="dot"></div><span class="lbl">麻ノ葉</span></div>
  <div class="map__pin map__pin--b"><div class="dot"></div><span class="lbl">Ivory</span></div>
  <div class="map__pin map__pin--c"><div class="dot"></div><span class="lbl">準備中</span></div>
  <div class="map__me"></div>
</div>

<div class="filterbar">
  <span class="fbtn fbtn--on">空席あり</span>
  <span class="fbtn">営業中</span>
  <span class="fbtn">バー</span>
  <span class="fbtn">スナック</span>
  <span class="fbtn">ダーツ</span>
  <span class="fbtn">現在地順</span>
</div>

<div class="listhead">現在地周辺 <strong>2 軒</strong> が今すぐ行けます</div>

<a class="row" href="#">
  <div class="row__thumb"><img src="../asanoha-hero-bg/public/images/hero-japanese.jpg" alt=""><span class="row__badge">空席7</span></div>
  <div class="row__body">
    <div class="row__name">麻ノ葉</div>
    <div class="row__tags">スナック・バー / 中新地</div>
    <div class="row__line"><span class="dist">120m</span> · 徒歩2分</div>
    <div class="row__line"><span class="row__open">営業中</span> 17:00–25:00</div>
    <div class="row__line"><span class="row__seats">残り 7 / 11 席</span></div>
  </div>
</a>
<a class="row" href="#">
  <div class="row__thumb"><img src="../ivory-hero-bg/public/images/hero-ivory.jpg" alt=""><span class="row__badge">営業中</span></div>
  <div class="row__body">
    <div class="row__name">Innocent Base Ivory</div>
    <div class="row__tags">バー・ダーツバー / 流川</div>
    <div class="row__line"><span class="dist">340m</span> · 徒歩4分</div>
    <div class="row__line"><span class="row__open">営業中</span> 21:00–05:00</div>
    <div class="row__line">定休 火曜</div>
  </div>
</a>
</body>
</html>
