<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>案1 クリーン — デザインプレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16181d; --muted:#6b7280; --soft:#9aa1ab;
  --line:#e8eaed; --brand:#1f2233; --accent:#d4365a; --green:#16a34a;
  --r:16px;
  --sans:'Noto Sans JP',system-ui,sans-serif;
  --disp:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;padding-bottom:60px;}
.preview-tag{position:fixed;top:0;left:0;right:0;z-index:99;background:var(--brand);color:#fff;text-align:center;font-size:11px;letter-spacing:.1em;padding:6px;font-weight:600;}

/* header */
.appbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(34px + env(safe-area-inset-top,0)) 20px 14px;display:flex;align-items:center;justify-content:space-between;}
.appbar__brand{font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:.02em;}
.appbar__brand .ac{color:var(--accent);}
.appbar__login{font-size:12px;font-weight:600;color:var(--brand);background:var(--bg);border:1px solid var(--line);padding:8px 14px;border-radius:999px;}

/* hero */
.hero{padding:34px 20px 24px;text-align:center;}
.hero__eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--accent);margin-bottom:10px;}
.hero__title{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1.3;letter-spacing:.01em;margin-bottom:10px;}
.hero__lead{font-size:14px;color:var(--muted);max-width:24em;margin:0 auto;}

/* search/filter */
.toolbar{display:flex;gap:8px;padding:6px 20px 18px;overflow-x:auto;scrollbar-width:none;}
.toolbar::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
.chip--on{background:var(--brand);color:#fff;border-color:var(--brand);}

/* section */
.section{padding:8px 20px 0;}
.section__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.section__title{font-family:var(--disp);font-weight:700;font-size:17px;}
.section__more{font-size:12px;color:var(--soft);}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:1fr;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(16,18,29,.04),0 8px 24px rgba(16,18,29,.05);}
.card__media{position:relative;aspect-ratio:16/10;background:#eceef1;}
.card__media img{width:100%;height:100%;object-fit:cover;display:block;}
.card__status{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.12);}
.card__status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.card__status--full{color:var(--accent);}
.card__status--full .dot{background:var(--accent);}
.card__fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.12);}
.card__fav svg{width:16px;height:16px;}
.card__body{padding:14px 16px 16px;}
.card__name{font-family:var(--disp);font-weight:900;font-size:20px;margin-bottom:3px;}
.card__tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:6px;}
.card__meta{display:flex;gap:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;}
.card__meta strong{display:block;color:var(--ink);font-size:14px;font-weight:700;}
.card__cta{margin-top:12px;display:block;text-align:center;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:12px;border-radius:10px;text-decoration:none;}

@media(min-width:680px){.grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="preview-tag">案 1 ／ クリーン・万人受け（モダン SaaS 風）</div>

<header class="appbar">
  <div class="appbar__brand">広島 飲み屋街<span class="ac">ガイド</span></div>
  <button class="appbar__login">ログイン</button>
</header>

<section class="hero">
  <p class="hero__eyebrow">HIROSHIMA NIGHT GUIDE</p>
  <h1 class="hero__title">今夜の一軒を、<br>すぐ見つかる。</h1>
  <p class="hero__lead">広島・中新地から流川まで。いま開いてる店・空いてる席が一目でわかる。</p>
</section>

<div class="toolbar">
  <span class="chip chip--on">すべて</span>
  <span class="chip">バー</span>
  <span class="chip">スナック</span>
  <span class="chip">ダーツバー</span>
  <span class="chip">ラウンジ</span>
  <span class="chip">居酒屋</span>
</div>

<section class="section">
  <div class="section__head">
    <h2 class="section__title">いま行ける店</h2>
    <span class="section__more" id="avail-count">—</span>
  </div>
  <div class="grid" id="store-grid"></div>
</section>

<script src="dummy-stores.js"></script>
<script>
(function(){
  var heart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var order={available:0,full:1,stopped:2,closed:3};
  var stores=window.DUMMY_STORES.slice().sort(function(a,b){return order[a.status]-order[b.status];});
  document.getElementById('avail-count').textContent='空席あり '+stores.filter(function(s){return s.status==='available';}).length+' 軒';
  document.getElementById('store-grid').innerHTML=stores.map(function(s){
    var sc=s.status==='full'?' card__status--full':'';
    var dim=s.status==='closed'?' style="opacity:.5"':'';
    var tags=s.genres.map(function(g){return '<span class="tag">'+window.GENRE_LABELS[g]+'</span>';}).join('');
    var right=s.seats?('空席<strong>'+s.seats+'</strong>'):('定休<strong>'+(s.closedNote||'—')+'</strong>');
    return '<article class="card"'+dim+'>'+
      '<div class="card__media">'+
        '<span class="card__status'+sc+'"><span class="dot"></span>'+window.STATUS_LABELS[s.status]+'</span>'+
        '<button class="card__fav">'+heart+'</button>'+
        '<img src="'+s.img+'" alt="'+s.name+'" loading="lazy" onerror="imgFallback(this,\''+s.id+'\')">'+
      '</div>'+
      '<div class="card__body">'+
        '<h3 class="card__name">'+s.nameHtml+'</h3>'+
        '<div class="card__tags">'+tags+'<span class="tag" style="border:none;background:transparent;color:var(--soft)">'+s.area+'</span></div>'+
        '<div class="card__meta"><div>営業<strong>'+s.open+'–'+s.close+'</strong></div><div>'+right+'</div></div>'+
        '<a class="card__cta" href="#">今から向かう</a>'+
      '</div></article>';
  }).join('');
})();
</script>
</body>
</html>
