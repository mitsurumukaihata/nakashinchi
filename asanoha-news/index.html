<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0c08">
<title>麻ノ葉 — お知らせ・今日の一言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700&family=Yuji+Syuku&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a href="../asanoha-admin/" class="topbar__back" title="管理画面へ戻る">← 管理</a>
    <div class="topbar__brand">
      <span class="topbar__brand-yomi">M A N O H A</span>
      <h1 class="topbar__brand-name">麻<span class="ja-accent">ノ</span>葉</h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="昼夜 テーマ切替">
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54A9.05 9.05 0 0 0 12 3z"/>
      </svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
          <line x1="12" y1="2"     x2="12"    y2="5"/>
          <line x1="12" y1="19"    x2="12"    y2="22"/>
          <line x1="2"  y1="12"    x2="5"     y2="12"/>
          <line x1="19" y1="12"    x2="22"    y2="12"/>
          <line x1="4.93"  y1="4.93"  x2="7.05"  y2="7.05"/>
          <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
          <line x1="4.93"  y1="19.07" x2="7.05"  y2="16.95"/>
          <line x1="16.95" y1="7.05"  x2="19.07" y2="4.93"/>
        </g>
      </svg>
    </button>
  </div>
</header>

<main class="page">
  <div class="page__head">
    <p class="page__crumb">管理 / お知らせ</p>
    <h1 class="page__title">お知らせ・今日の一言</h1>
    <p class="page__lead">トップページに出る短いメッセージを編集できます。「本日のおすすめ」「貸切のお知らせ」「ママから一言」など、お客様の目に最初に入る言葉をここから書き換えられます。</p>
  </div>

  <section class="card-form">
    <div class="form-row">
      <label class="form-label" for="news-text">メッセージ</label>
      <textarea id="news-text" class="form-textarea" maxlength="120" rows="4"
        placeholder="例：本日は鯛が入りました。19時頃まで残り席ございます。"></textarea>
      <div class="form-foot">
        <span class="form-count"><span id="char-now">0</span> / 120 文字</span>
        <span class="form-updated" id="last-updated"></span>
      </div>
    </div>
  </section>

  <section class="card-form">
    <p class="form-label">公開ページでの見え方（プレビュー）</p>
    <div class="news-preview">
      <div class="news-preview__inner">
        <span class="news-preview__tag">お知らせ</span>
        <span class="news-preview__text" id="preview-text">（メッセージ未設定）</span>
      </div>
      <p class="news-preview__note">※ 実際のトップページ ヒーロー上部に同じ形で表示されます</p>
    </div>
  </section>

  <div class="page-actions">
    <button class="btn btn--ghost" id="clear-btn" type="button">クリア</button>
    <button class="btn btn--primary" id="save-btn" type="button">保存して公開</button>
  </div>

  <p class="note-text">
    ※ 現時点では同一端末・同一ブラウザのみに反映されます。複数端末・お客様の端末への同期は、Cloudflare 連携で対応予定です。
  </p>
</main>

<div class="toast" id="toast" hidden></div>

<script src="script.js" defer></script>
</body>
</html>
